name: Validar e gerar candidato
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Preparar ambiente
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements-build.txt
          .venv/Scripts/python -m pip install --no-deps -e .
      - name: Testar e compilar
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Preparar compilador e WebView2
        shell: pwsh
        run: ./scripts/prepare-tools.ps1
      - name: Gerar dois instaladores
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidato-acmais-link-x64
          path: artifacts/*
          retention-days: 14
# Deliberately no tag/release/push permissions: publication follows owner approval.
