[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acmais-link"
version = "1.0.0"
description = "Portal desktop leve para acesso seguro aos ambientes SharePoint da ACMais"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25.6,<26",
  "pywebview>=6.1,<7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.15,<7"]

[project.scripts]
acmais-link = "acmais_link.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acmais_link = ["web/*", "assets/*"]
